<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected SVG</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            margin-bottom: 10px;
        }

        .company {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: red;
            margin-top: 12px;
            display: none;
        }

        .developer {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <script>
        atOptions = {
            'key' : 'e50788051c879eeadcb44c8150f51448',
            'format' : 'iframe',
            'height' : 600,
            'width' : 160,
            'params' : {}
        };
    </script>

    <div class="login-box">

        <h2>AR Developers</h2>

        <div class="company">
            Protected SVG Access
        </div>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button onclick="checkPassword()">
            Open SVG
        </button>

        <div id="error" class="error">
            Incorrect password!
        </div>

        <div class="developer">
            Developed by <strong>Ankitbhai Rasikbhai Rojasara</strong>
        </div>

    </div>

    <script>
    atOptions = {
        'key' : '770f949af6bc9dff3d4818d6d7d38df7',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
    };
    </script>
    <script src="https://www.highrevenueformat.com/770f949af6bc9dff3d4818d6d7d38df7/invoke.js"></script>

    <script>
        const correctPassword = "123456";

        function checkPassword() {
            const password = document.getElementById("password").value;
            const error = document.getElementById("error");

            if (password === correctPassword) {

                // Redirect to SVG file
                window.location.href = "sampale.svg";

            } else {

                error.style.display = "block";
                document.getElementById("password").value = "";
            }
        }

        // Press Enter to open SVG
        document.getElementById("password").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>

</body>
</html>
